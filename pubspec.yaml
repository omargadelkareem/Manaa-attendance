name: manaa_attendance
description: "Manaa Glass Attendance System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  camera: ^0.11.0+2

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_storage: ^2.1.1
  
  face_plugin: ^0.0.4

  # Navigation
  go_router: ^14.2.7

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Camera & Face Detection
  google_mlkit_face_detection: ^0.12.0

  # Location
 

  # Local Storage
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/